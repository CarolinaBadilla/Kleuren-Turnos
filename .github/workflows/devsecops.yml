name: DevSecOps Enterprise Pipeline - Kleuren

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------------
  # 1. DETECCIÓN DE SECRETOS (Gitleaks)
  # -------------------------------------------------------------------
  secrets-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executing Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # 2. ANÁLISIS ESTÁTICO DE CÓDIGO FUENTE (SAST - Semgrep)
  # -------------------------------------------------------------------
  sast-scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets-scan
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
  # -------------------------------------------------------------------
  # 3. ESCANEO DE CONTENEDORES Y VULNERABILIDADES (Trivy)
  # -------------------------------------------------------------------
  container-security:
    name: Container & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sast-scan
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: |
          docker build -t kleuren-web:test -f backend/Dockerfile backend/

      - name: Install Trivy CLI
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run Trivy Scan
        run: |
          trivy image --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH kleuren-web:test

      - name: Upload Trivy SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # -------------------------------------------------------------------
  # 4. DESPLIEGUE SEGURO (CD - Continuous Deployment)
  # -------------------------------------------------------------------
  deploy-vps:
    name: Production Deployment to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: container-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop_on_error: true
          script: |
            cd ~/kleuren/codigo_fuente
            git pull origin main
            cd ~/kleuren
            docker compose up -d --build --remove-orphans
            docker image prune -f